<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.7)),
        url('https://images.unsplash.com/photo-1541443131876-5bc9b12066b8?w=1200&q=80') center/cover no-repeat;
      display: flex; align-items: center; justify-content: center;
      font-family: sans-serif;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 2rem 2.5rem;
      width: 100%; max-width: 420px;
      backdrop-filter: blur(12px);
      text-align: center;
    }
    h1 { color: #fff; font-size: 28px; font-weight: 500; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.6); font-size: 15px; margin-bottom: 1.5rem; }
    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 99px;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }
    a {
      display: inline-block; background: #fff; color: #111;
      border-radius: 8px; padding: 10px 24px;
      font-size: 15px; font-weight: 500; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">SECRET UNLOCKED</div>
    <h1>You found the easter egg!</h1>
    <p>Only the true Audi enthusiasts know about this one. Welcome to the club.</p>
    <a href="/">Go back</a>
  </div>
</body>
</html>
