<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post office</title>
  <script>
  
    /*
    Author: Lucas Burt 
    Description: Google web page that calculates the postage cost for different types of mail based on their dimensions and post codes, classifying items into diffrent catagories 
    Bugs: Does not go to second decimal if there is a non decimal number.
    Sources: Google
    Dates: 11.11.25
    Features: 4 unique functions to classify mail by size, calculates postage by class and zones, flags unmailable items, rounds costs to 2 decimals.
Log: 1.2 

    */
  
    function getcost(ptype,ztype){
    /*
    description - calculates  the  cost  based on the package type and postal zone.
    args - ptype: package type, ztype: zipcode zone 
    returns- float: cost of package in $  
    */
    
    if (ptype == 1)
      {
        return (.20 + 0.03 * ztype);
      }
    else if (ptype == 2)
      {
        return (.37 + 0.03 * ztype );
      }
    else if (ptype == 3)
      {
        return (.37 + 0.04 * ztype )
      }
    else if (ptype == 4)
      {
        return (.60 + 0.05 * ztype) 
      }
    else if (ptype == 5) 
      {
        return (2.95 + 0.25 * ztype)
      }
    else if (ptype == 6) 
      {
        return( 3.95 + 0.35 * ztype) 
      }
    else if (ptype == -1)
        return("UNMAILABLE");
    }
    
    function getzip(zip)
    /*
    description - gets the  zipcode based on the inputs of user (classifying into diffrent groups/zones)  
    args - zip: zip code (int) of either the origin or destination.
    returns- integer from 1-6 based on the zones 
    */

    {
     ztype = 0
    
    if(zip > 1 && zip < 6999)
    {
        ztype = 1;
    }
    else if(zip > 7000 && zip < 19999) 
        ztype = 2;
    else if(zip > 20000 && zip < 35999) 
        ztype = 3;
    else if(zip > 36000 && zip < 62999)
        ztype = 4;
    else if(zip > 63000 && zip < 84999) 
        ztype = 5;
    else if(zip > 85000 && zip < 99999)
        ztype = 6;
    
    return ztype 
    }


    function get_type(num1,num2,num3) {
    /*
    description - takes in the user input dimensions, classifys them into diffrent types.
    args - l: length w: width h: hieght 
    returns- specific package type based on user input
    */
    

      if (num1 >= 3.5 && num1 <= 4.25 && num2 >=3.5 && num2 <=6 && num3>=.007 && num3 <=.016)
      {
        return 1;
      }
      else if(num1 >= 4.25 && num1 <= 6 && num2 >= 6 && num2 <=11.5 && num3 >= .007 && num3 <=.15)
      {
        return  2;
      }
      else if(num1 > 3.5 && num1 <=6.124 && num2 >=5 && num2 <= 11.5 && num3 >= .016 && num3 <=.25)
      {
        return 3
      }
      else if(num1 >= 6.125 && num1 <= 24 && num2 >= 11 && num2 <=18 && num3 >=.25 && num3 <=.5)
      {
      return 4;
      }
      else if (num1 + num2 + num3 >= 84 && num1 + num2 + num3 <= 130)
      {
        return 5;
      }
      else if (num1 + num2 + num2 + num3 + num3 >= 84 && num1 + num2 + num2 + num3 + num3 <= 130)   
      {
      return 6;
      } 
      else if (num1 + num2 + num3 > 130) 
      { 
        return -1;
      }
      else
      {
        return -1;  
      }
    }
    
    // This function reads two input values, adds them, and displays the result.
    function main() {
      // Get values from the input fields
      let num1 = document.getElementById("length").value;
      num1 = parseFloat(num1)
      let num2 = document.getElementById("height").value;
      num2 = parseFloat(num2)
      let num3 = document.getElementById("width").value;
      num3 = parseFloat(num3)
      let num4 = document.getElementById("zip_start").value;
      num4 = parseFloat(num4)
      let num5 = document.getElementById("zip_end").value;
      num5 = parseFloat(num5)

      // Convert the values to numbers (since inputs are strings by default)

        let ptype = get_type(num1,num2,num3);

        console.log("the type: " + ptype)

        let ztype = Math.abs(getzip(num4) - getzip(num5))
        let price = getcost(ptype,ztype);
        console.log("Zone:" + ztype)
        console.log("Type" + ptype)
        console.log(price)


      // Display the result inside the <p> tag
        formatted_price = (price.toPrecision(2)).replace(/^0+/, '')
      document.getElementById("result").innerText = formatted_price;

      console.log("The cost is: " + price);

    }
  </script>
  <style>
  body {
    background-image: url('https://images7.alphacoders.com/357/thumb-1920-357171.jpg');
  }
</style>
  
</head>
<body>
  <h2 style="color: white; font-size: x-large;">Post office</h2>

  <!-- Input fields -->
  <input type="number" id="length" placeholder="Enter package height"><br>
  <input type="number" id="height" placeholder="Enter package width "> <br>
  <input type="number" id="width" placeholder="Enter package length"><br>
  <input type="number" id="zip_start" placeholder="Enter zipcode of arrival"><br>
  <input type="number" id="zip_end" placeholder="Enter zipcode of departure"><br>

  <!-- Button that calls the function -->
  <button onclick="main()">Add</button>

  <!-- Area to display the result -->
  <p style="color: white;" id="result"></p>
</body>
</html>
